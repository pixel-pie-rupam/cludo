<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SECCOM 2025 | Treasure Hunt - Admin Dashboard</title>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/en/thumb/3/36/Brainware_University.svg/250px-Brainware_University.svg.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');
        
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --danger-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; }

        body { 
            background: linear-gradient(135deg, #0c0f1f 0%, #1a1b3a 50%, #0f172a 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 40% 40%, rgba(120, 219, 226, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .glass-effect {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .glass-effect-strong {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        .gradient-text { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .gradient-button { background: var(--primary-gradient); transition: all 0.3s ease; position: relative; overflow: hidden; }
        .gradient-button::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: left 0.5s; }
        .gradient-button:hover::before { left: 100%; }
        .gradient-button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .success-button { background: var(--success-gradient); }
        .danger-button { background: var(--danger-gradient); }
        .secondary-button { background: var(--secondary-gradient); }

        .table-auto th, .table-auto td { padding: 1rem; text-align: left; border-bottom: 1px solid rgba(148,163,184,0.2); }
        .table-auto th { background: rgba(30,41,59,0.3); backdrop-filter: blur(10px); font-weight: 600; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .table-auto tr:hover { background: rgba(255,255,255,0.03); transform: translateY(-1px); transition: all 0.2s ease; }

        .spinner { border: 3px solid rgba(255,255,255,0.3); border-left-color: #06b6d4; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-backdrop { background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); }
        .floating-animation { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        .pulse-glow { animation: pulse-glow 2s ease-in-out infinite alternate; }
        @keyframes pulse-glow { from { box-shadow: 0 0 20px rgba(102,126,234,0.3); } to { box-shadow: 0 0 40px rgba(102,126,234,0.6), 0 0 60px rgba(102,126,234,0.3); } }
        .logo-glow { filter: drop-shadow(0 0 10px rgba(102,126,234,0.5)); }
        .input-glow:focus { box-shadow: 0 0 0 3px rgba(102,126,234,0.2); border-color: #667eea; }

        .leaderboard-item { background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%); border-left: 3px solid transparent; transition: all 0.3s ease; }
        .leaderboard-item:hover { border-left-color: #667eea; transform: translateX(5px); background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.04) 100%); }
        .rank-1 { border-left-color: #ffd700; }
        .rank-2 { border-left-color: #c0c0c0; }
        .rank-3 { border-left-color: #cd7f32; }

        .section-header { position: relative; padding-bottom: 1rem; }
        .section-header::after { content: ''; position: absolute; bottom: 0; left: 0; width: 60px; height: 3px; background: var(--primary-gradient); border-radius: 2px; }

        .footer { backdrop-filter: blur(20px); background: rgba(0, 0, 0, 0.2); border-top: 1px solid rgba(255,255,255,0.1); }
        .brand-header { background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.1); }

        .form-floating { position: relative; }
        .form-floating input:focus + label, .form-floating input:not(:placeholder-shown) + label { transform: translateY(-1.5rem) scale(0.85); color: #667eea; }
        .form-floating label { position: absolute; top: 0.75rem; left: 1rem; transition: all 0.2s ease; pointer-events: none; color: #94a3b8; }
    </style>
</head>
<body class="text-slate-100">

    <!-- =========== LOGIN SCREEN =========== -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="absolute inset-0 overflow-hidden">
            <div class="absolute -top-40 -right-40 w-80 h-80 bg-purple-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 floating-animation"></div>
            <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-cyan-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 floating-animation" style="animation-delay: 2s;"></div>
        </div>
        
        <div class="relative w-full max-w-md">
            <div class="glass-effect-strong rounded-2xl shadow-2xl p-8 pulse-glow">
                <div class="text-center mb-8">
                    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/3/36/Brainware_University.svg/250px-Brainware_University.svg.png" 
                         alt="Brainware University" class="w-16 h-16 mx-auto mb-4 logo-glow">
                    <h1 class="text-3xl font-bold gradient-text mb-2">SECCOM 2025</h1>
                    <p class="text-xl font-semibold text-cyan-400">Treasure Hunt</p>
                    <p class="text-sm text-slate-400 mt-2">Admin Control Panel</p>
                </div>
                
                <div class="space-y-6">
                    <div class="form-floating">
                        <input id="login-email" type="email" placeholder=" " class="w-full bg-slate-800/50 border border-slate-600 p-3 rounded-xl focus:outline-none input-glow transition-all">
                        <label>Admin Email</label>
                    </div>
                    <div class="form-floating">
                        <input id="login-password" type="password" placeholder=" " class="w-full bg-slate-800/50 border border-slate-600 p-3 rounded-xl focus:outline-none input-glow transition-all">
                        <label>Password</label>
                    </div>
                    <button id="login-button" class="w-full gradient-button text-white font-bold py-3 px-6 rounded-xl transition-all flex items-center justify-center text-lg">
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        Access Dashboard
                    </button>
                </div>
                <p id="login-error" class="text-red-400 text-center mt-6 h-4 text-sm"></p>
            </div>
        </div>
    </div>

    <!-- =========== ADMIN DASHBOARD =========== -->
    <div id="dashboard-screen" class="hidden min-h-screen">
        <!-- Header -->
        <header class="brand-header sticky top-0 z-40 px-4 md:px-8 py-4">
            <div class="flex flex-wrap justify-between items-center">
                <div class="flex items-center space-x-4">
                    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/3/36/Brainware_University.svg/250px-Brainware_University.svg.png" 
                         alt="Brainware University" class="w-10 h-10 logo-glow">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold gradient-text">SECCOM 2025</h1>
                        <p class="text-sm text-cyan-400 font-medium">Treasure Hunt - Admin Panel</p>
                    </div>
                </div>
                <button id="logout-button" class="danger-button gradient-button text-white font-medium py-2 px-4 rounded-lg transition-all">
                    <i class="fas fa-sign-out-alt mr-2"></i>Logout
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="p-4 md:p-8 pb-24">
            <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
                <!-- Left Column: Controls & Forms -->
                <div class="lg:col-span-2 space-y-8">
                    <!-- Game State Control -->
                    <div class="glass-effect p-6 rounded-2xl shadow-2xl">
                        <h2 class="text-xl font-bold mb-6 section-header text-purple-300">
                            <i class="fas fa-gamepad mr-3"></i>Game Controls
                        </h2>
                        <div class="space-y-6">
                            <div>
                                <label for="clue-tier-input" class="block text-sm font-medium text-slate-300 mb-2">Current Clue Tier</label>
                                <div class="flex items-center space-x-3">
                                    <input type="number" id="clue-tier-input" class="flex-1 bg-slate-800/50 border border-slate-600 p-3 rounded-xl input-glow" min="1">
                                    <button id="set-tier-button" class="success-button gradient-button text-white font-bold py-3 px-6 rounded-xl">
                                        <i class="fas fa-check mr-2"></i>Set
                                    </button>
                                </div>
                            </div>
                            <div>
                                <label for="broadcast-input" class="block text-sm font-medium text-slate-300 mb-2">Broadcast Message</label>
                                <textarea id="broadcast-input" rows="3" class="w-full bg-slate-800/50 border border-slate-600 p-3 rounded-xl input-glow" placeholder="e.g., A new clue has been revealed!"></textarea>
                                <button id="send-broadcast-button" class="w-full mt-3 secondary-button gradient-button text-white font-bold py-3 px-6 rounded-xl">
                                    <i class="fas fa-broadcast-tower mr-2"></i>Send Broadcast
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Add Clue Form -->
                    <div class="glass-effect p-6 rounded-2xl shadow-2xl">
                        <h2 class="text-xl font-bold mb-6 section-header text-green-300">
                            <i class="fas fa-plus-circle mr-3"></i>Add New Clue
                        </h2>
                        <form id="add-clue-form" class="space-y-4">
                            <input type="text" id="clue-title" placeholder="Clue Title" required class="w-full bg-slate-800/50 border border-slate-600 p-3 rounded-xl input-glow">
                            <textarea id="clue-text" placeholder="Clue Text" required class="w-full bg-slate-800/50 border border-slate-600 p-3 rounded-xl input-glow"></textarea>
                            <input type="text" id="clue-flag" placeholder="FLAG{...}" required class="w-full bg-slate-800/50 border border-slate-600 p-3 rounded-xl input-glow font-mono">
                            <input type="text" id="clue-hint" placeholder="Hint (Optional)" class="w-full bg-slate-800/50 border border-slate-600 p-3 rounded-xl input-glow">
                            <input type="number" id="clue-unlock-tier" placeholder="Unlock Tier" required class="w-full bg-slate-800/50 border border-slate-600 p-3 rounded-xl input-glow" min="1">
                            <div class="flex items-center space-x-3 p-3 bg-slate-800/30 rounded-xl">
                                <input type="checkbox" id="clue-is-rabbit-hole" class="h-4 w-4 rounded border-gray-300 text-cyan-600 focus:ring-cyan-500">
                                <label for="clue-is-rabbit-hole" class="text-sm text-slate-300">Is this a Rabbit Hole?</label>
                            </div>
                            <button type="submit" class="w-full success-button gradient-button text-white font-bold py-3 px-6 rounded-xl flex items-center justify-center text-lg">
                                <i class="fas fa-plus mr-2"></i>Add Clue
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Right Column: Tables -->
                <div class="lg:col-span-3 space-y-8">
                    <!-- Live Leaderboard -->
                    <div class="glass-effect p-6 rounded-2xl shadow-2xl">
                        <h2 class="text-xl font-bold mb-6 section-header text-yellow-300">
                            <i class="fas fa-trophy mr-3"></i>Live Leaderboard
                        </h2>
                        <div id="leaderboard" class="space-y-3"></div>
                    </div>

                    <!-- Manage Clues Table -->
                    <div class="glass-effect p-6 rounded-2xl shadow-2xl">
                        <h2 class="text-xl font-bold mb-6 section-header text-cyan-300">
                            <i class="fas fa-cogs mr-3"></i>Manage Clues
                        </h2>
                        <div class="overflow-x-auto rounded-xl">
                            <table class="w-full table-auto">
                                <thead>
                                    <tr>
                                        <th><i class="fas fa-tag mr-2"></i>Title</th>
                                        <th><i class="fas fa-layer-group mr-2"></i>Tier</th>
                                        <th class="text-center"><i class="fas fa-tools mr-2"></i>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="clues-table-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer fixed bottom-0 left-0 right-0 px-4 py-3 z-30">
            <div class="text-center">
                <p class="text-sm text-slate-400">
                    <i class="fas fa-code mr-2"></i>Developed by <span class="text-cyan-400 font-semibold">Rupam Gachchhit</span>
                </p>
            </div>
        </footer>
    </div>

    <!-- Clue Details Modal -->
    <div id="clue-details-modal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 hidden z-50">
        <div class="glass-effect-strong w-full max-w-2xl rounded-2xl shadow-2xl p-8 relative">
            <button id="close-details-modal-button" class="absolute top-4 right-4 text-2xl text-slate-400 hover:text-white transition-colors bg-slate-800/50 w-8 h-8 rounded-full flex items-center justify-center" aria-label="Close details">&times;</button>
            <h2 id="details-title" class="text-2xl font-bold gradient-text mb-6 section-header">
                <i class="fas fa-info-circle mr-3"></i>Clue Details
            </h2>
            <div class="space-y-4 text-base">
                <div class="p-4 bg-slate-800/30 rounded-xl">
                    <strong class="text-cyan-400">Title:</strong>
                    <span id="details-clueTitle" class="text-slate-200 ml-2"></span>
                </div>
                <div class="p-4 bg-slate-800/30 rounded-xl">
                    <strong class="text-cyan-400">Text:</strong>
                    <span id="details-clueText" class="text-slate-200 ml-2 break-words"></span>
                </div>
                <div class="p-4 bg-slate-800/30 rounded-xl">
                    <strong class="text-cyan-400">Flag:</strong>
                    <span id="details-flag" class="text-green-400 font-mono ml-2"></span>
                </div>
                <div class="p-4 bg-slate-800/30 rounded-xl">
                    <strong class="text-cyan-400">Hint:</strong>
                    <span id="details-hint" class="text-yellow-400 ml-2"></span>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="p-4 bg-slate-800/30 rounded-xl">
                        <strong class="text-cyan-400">Tier:</strong>
                        <span id="details-unlockTier" class="text-slate-200 ml-2"></span>
                    </div>
                    <div class="p-4 bg-slate-800/30 rounded-xl">
                        <strong class="text-cyan-400">Rabbit Hole:</strong>
                        <span id="details-isRabbitHole" class="text-slate-200 ml-2"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Clue Modal -->
    <div id="edit-clue-modal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 hidden z-50">
        <div class="glass-effect-strong w-full max-w-2xl rounded-2xl shadow-2xl p-8 relative">
            <button id="close-edit-modal-button" class="absolute top-4 right-4 text-2xl text-slate-400 hover:text-white transition-colors bg-slate-800/50 w-8 h-8 rounded-full flex items-center justify-center" aria-label="Close edit">&times;</button>
            <h2 class="text-2xl font-bold gradient-text mb-6 section-header">
                <i class="fas fa-pen-to-square mr-3"></i>Edit Clue
            </h2>
            <form id="edit-clue-form" class="space-y-4">
                <input type="text" id="edit-clue-title" placeholder="Clue Title" required class="w-full bg-slate-800/50 border border-slate-600 p-3 rounded-xl input-glow">
                <textarea id="edit-clue-text" placeholder="Clue Text" required class="w-full bg-slate-800/50 border border-slate-600 p-3 rounded-xl input-glow"></textarea>
                <input type="text" id="edit-clue-flag" placeholder="FLAG{...}" required class="w-full bg-slate-800/50 border border-slate-600 p-3 rounded-xl input-glow font-mono">
                <input type="text" id="edit-clue-hint" placeholder="Hint (Optional)" class="w-full bg-slate-800/50 border border-slate-600 p-3 rounded-xl input-glow">
                <input type="number" id="edit-clue-unlock-tier" placeholder="Unlock Tier" required class="w-full bg-slate-800/50 border border-slate-600 p-3 rounded-xl input-glow" min="1">
                <label class="flex items-center space-x-3 p-3 bg-slate-800/30 rounded-xl">
                    <input type="checkbox" id="edit-clue-is-rabbit-hole" class="h-4 w-4 rounded border-gray-300 text-cyan-600 focus:ring-cyan-500">
                    <span class="text-sm text-slate-300">Is this a Rabbit Hole?</span>
                </label>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" id="cancel-edit" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600">Cancel</button>
                    <button type="submit" class="px-5 py-2 rounded-lg success-button gradient-button font-semibold">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
        // --- CONFIGURATION ---
        const firebaseConfig = {
         apiKey: "AIzaSyBokbGtzP7ZSp1mFS5K8hDUGRUB0E37UPs",
  authDomain: "treasurehuntcompetition2025.firebaseapp.com",
  projectId: "treasurehuntcompetition2025",
  storageBucket: "treasurehuntcompetition2025.firebasestorage.app",
  messagingSenderId: "983621809061",
  appId: "1:983621809061:web:ed668aceef58addbb1ee4c"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- DOM ELEMENTS ---
        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const loginEmailInput = document.getElementById('login-email');
        const loginPasswordInput = document.getElementById('login-password');
        const loginButton = document.getElementById('login-button');
        const loginError = document.getElementById('login-error');
        const logoutButton = document.getElementById('logout-button');
        const clueTierInput = document.getElementById('clue-tier-input');
        const setTierButton = document.getElementById('set-tier-button');
        const broadcastInput = document.getElementById('broadcast-input');
        const sendBroadcastButton = document.getElementById('send-broadcast-button');
        const leaderboard = document.getElementById('leaderboard');
        const addClueForm = document.getElementById('add-clue-form');
        const cluesTableBody = document.getElementById('clues-table-body');
        const clueDetailsModal = document.getElementById('clue-details-modal');
        const closeDetailsModalButton = document.getElementById('close-details-modal-button');

        // Edit modal elements
        const editClueModal = document.getElementById('edit-clue-modal');
        const closeEditModalButton = document.getElementById('close-edit-modal-button');
        const cancelEditButton = document.getElementById('cancel-edit');
        const editClueForm = document.getElementById('edit-clue-form');
        const editTitle = document.getElementById('edit-clue-title');
        const editText = document.getElementById('edit-clue-text');
        const editFlag = document.getElementById('edit-clue-flag');
        const editHint = document.getElementById('edit-clue-hint');
        const editTier = document.getElementById('edit-clue-unlock-tier');
        const editRabbit = document.getElementById('edit-clue-is-rabbit-hole');
        let editingClueId = null;
        
        let allClues = []; // Local cache of clues

        // --- AUTHENTICATION ---
        loginButton.addEventListener('click', () => {
            loginError.textContent = '';
            loginButton.disabled = true;
            loginButton.innerHTML = `<div class="spinner"></div>`;
            const email = (loginEmailInput.value || '').trim();
            const pass = loginPasswordInput.value || '';
            auth.signInWithEmailAndPassword(email, pass)
                .catch(error => { 
                    console.error(error);
                    loginError.textContent = 'Invalid admin credentials.'; 
                    loginButton.disabled = false;
                    loginButton.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Access Dashboard';
                });
        });
        logoutButton.addEventListener('click', () => auth.signOut());

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    // Check admin flag in teams collection for this auth user
                    const snapshot = await db.collection('teams').where('authUid', '==', user.uid).get();
                    let isAdmin = false;
                    if (!snapshot.empty) {
                        snapshot.forEach(doc => { if (doc.data().isAdmin === true) isAdmin = true; });
                    }
                    if (isAdmin) {
                        loginScreen.style.display = 'none';
                        dashboardScreen.style.display = 'block';
                        initializeAdminListeners();
                    } else {
                        loginError.textContent = 'You do not have admin privileges.';
                        await auth.signOut();
                    }
                } catch (err) {
                    console.error(err);
                    loginError.textContent = 'An error occurred during verification.';
                    await auth.signOut();
                } finally {
                    loginButton.disabled = false;
                    loginButton.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Access Dashboard';
                }
            } else {
                loginScreen.style.display = 'flex';
                dashboardScreen.style.display = 'none';
                loginButton.disabled = false;
                loginButton.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Access Dashboard';
            }
        });

        // --- INITIALIZE LISTENERS ---
        function initializeAdminListeners() {
            // Game state
            db.collection('game_state').doc('main').onSnapshot(doc => {
                if (doc.exists) { clueTierInput.value = doc.data().currentClueTier || 1; }
            });

            // Leaderboard (exclude admins)
            db.collection('teams').orderBy('score', 'desc').onSnapshot(snapshot => {
                leaderboard.innerHTML = '';
                let rank = 1;
                snapshot.forEach(doc => {
                    const team = doc.data();
                    if (team.isAdmin) return;
                    const teamElement = document.createElement('div');
                    let rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
                    teamElement.className = `leaderboard-item ${rankClass} flex justify-between items-center p-4 rounded-xl transition-all cursor-pointer`;
                    teamElement.innerHTML = `
                        <div class="flex items-center space-x-4">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-r from-cyan-500 to-purple-500 flex items-center justify-center font-bold text-white">${rank}</div>
                            <div>
                                <span class="font-semibold text-slate-100">${escapeHTML(team.teamName || 'Team')}</span>
                                <div class="text-xs text-slate-400">Team ${rank}</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="font-bold text-xl text-green-400">${Number(team.score || 0)}</span>
                            <div class="text-xs text-slate-400">points</div>
                        </div>`;
                    leaderboard.appendChild(teamElement);
                    rank++;
                });
            });

            // Clues list
            db.collection('clues').orderBy('unlockTier').onSnapshot(snapshot => {
                allClues = [];
                snapshot.forEach(doc => allClues.push({ id: doc.id, ...doc.data() }));
                renderCluesTable();
            });
        }
        
        // --- UTIL: Escape HTML to avoid accidental injection in innerHTML
        function escapeHTML(str) {
            return (str || '').toString()
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // --- RENDER FUNCTIONS ---
        function renderCluesTable() {
            cluesTableBody.innerHTML = '';
            allClues.forEach(clue => {
                const row = document.createElement('tr');
                row.className = 'border-b border-slate-700/50 hover:bg-slate-700/30 transition-all';
                row.innerHTML = `
                    <td class="font-medium">${escapeHTML(clue.clueTitle)}</td>
                    <td class="text-center">
                        <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-cyan-400/20 text-cyan-300">${escapeHTML(clue.unlockTier)}</span>
                    </td>
                    <td class="text-center">
                        <div class="flex justify-center space-x-2">
                            <button onclick="openClueDetailsModal('${clue.id}')" class="text-blue-400 hover:text-blue-300 p-2 rounded-lg hover:bg-blue-400/10 transition-all" title="View Details">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button onclick="openEditClueModal('${clue.id}')" class="text-yellow-300 hover:text-yellow-200 p-2 rounded-lg hover:bg-yellow-300/10 transition-all" title="Edit Clue">
                                <i class="fas fa-pen-to-square"></i>
                            </button>
                            <button onclick="deleteClue('${clue.id}')" class="text-red-400 hover:text-red-300 p-2 rounded-lg hover:bg-red-400/10 transition-all" title="Delete Clue">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>`;
                cluesTableBody.appendChild(row);
            });
        }

        // --- CONTROL & MANAGEMENT FUNCTIONS ---
        setTierButton.addEventListener('click', async () => {
            const newTier = parseInt(clueTierInput.value, 10);
            if (isNaN(newTier) || newTier < 1) { alert('Please enter a valid tier number.'); return; }
            try {
                await db.collection('game_state').doc('main').set({ currentClueTier: newTier }, { merge: true });
                alert(`Game tier set to ${newTier}.`);
            } catch (e) {
                console.error(e);
                alert('Failed to update tier.');
            }
        });

        sendBroadcastButton.addEventListener('click', async () => {
            const message = broadcastInput.value.trim();
            if (!message) { alert('Please enter a message.'); return; }
            try {
                // Store latest broadcast in game_state and also append to a log collection
                const batch = db.batch();
                const gameStateRef = db.collection('game_state').doc('main');
                batch.set(gameStateRef, { broadcastMessage: message, broadcastAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                const logRef = db.collection('broadcasts').doc();
                batch.set(logRef, { message, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                await batch.commit();
                alert('Broadcast sent!');
                broadcastInput.value = '';
            } catch (e) {
                console.error(e);
                alert('Broadcast failed.');
            }
        });

        addClueForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitButton = addClueForm.querySelector('button[type="submit"]');
            submitButton.disabled = true; submitButton.innerHTML = `<div class="spinner mx-auto"></div>`;
            const newClue = {
                clueTitle: document.getElementById('clue-title').value.trim(),
                clueText: document.getElementById('clue-text').value.trim(),
                flag: document.getElementById('clue-flag').value.trim(),
                hint: document.getElementById('clue-hint').value.trim(),
                unlockTier: parseInt(document.getElementById('clue-unlock-tier').value, 10),
                isRabbitHole: document.getElementById('clue-is-rabbit-hole').checked,
                solvers: {},
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            try {
                await db.collection('clues').add(newClue);
                alert('Clue added successfully!');
                addClueForm.reset();
            } catch (error) {
                console.error(error);
                alert('Failed to add clue.');
            } finally {
                submitButton.disabled = false; submitButton.innerHTML = '<i class="fas fa-plus mr-2"></i>Add Clue';
            }
        });

        // --- CLUE DETAILS MODAL FUNCTIONS ---
        function openClueDetailsModal(clueId) {
            const clue = allClues.find(c => c.id === clueId);
            if (!clue) { alert('Could not find clue details.'); return; }
            document.getElementById('details-clueTitle').textContent = clue.clueTitle || 'N/A';
            document.getElementById('details-clueText').textContent = clue.clueText || 'N/A';
            document.getElementById('details-flag').textContent = clue.flag || 'N/A';
            document.getElementById('details-hint').textContent = clue.hint || 'N/A';
            document.getElementById('details-unlockTier').textContent = (clue.unlockTier ?? 'N/A');
            document.getElementById('details-isRabbitHole').textContent = clue.isRabbitHole ? 'Yes' : 'No';
            clueDetailsModal.classList.remove('hidden');
        }
        function closeModal(el) { el.classList.add('hidden'); }
        closeDetailsModalButton.addEventListener('click', () => closeModal(clueDetailsModal));

        // --- EDIT CLUE MODAL FUNCTIONS ---
        function openEditClueModal(clueId) {
            const clue = allClues.find(c => c.id === clueId);
            if (!clue) { alert('Could not find clue to edit.'); return; }
            editingClueId = clueId;
            editTitle.value = clue.clueTitle || '';
            editText.value = clue.clueText || '';
            editFlag.value = clue.flag || '';
            editHint.value = clue.hint || '';
            editTier.value = clue.unlockTier || 1;
            editRabbit.checked = !!clue.isRabbitHole;
            editClueModal.classList.remove('hidden');
        }
        document.getElementById('close-edit-modal-button')?.addEventListener('click', () => closeModal(editClueModal));
        cancelEditButton.addEventListener('click', () => closeModal(editClueModal));

        editClueForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!editingClueId) return;
            const update = {
                clueTitle: editTitle.value.trim(),
                clueText: editText.value.trim(),
                flag: editFlag.value.trim(),
                hint: editHint.value.trim(),
                unlockTier: parseInt(editTier.value, 10),
                isRabbitHole: editRabbit.checked,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            try {
                await db.collection('clues').doc(editingClueId).update(update);
                alert('Clue updated.');
                editClueModal.classList.add('hidden');
                editingClueId = null;
            } catch (e2) {
                console.error(e2);
                alert('Failed to update clue.');
            }
        });

        // --- DELETE FUNCTION ---
        async function deleteClue(clueId) {
            if (!confirm('Are you sure you want to delete this clue permanently?')) return;
            try {
                await db.collection('clues').doc(clueId).delete();
                alert('Clue deleted.');
            } catch (e) {
                console.error(e);
                alert('Failed to delete clue.');
            }
        }

        // Expose a few functions to the window for inline onclick handlers
        window.openClueDetailsModal = openClueDetailsModal;
        window.openEditClueModal = openEditClueModal;
        window.deleteClue = deleteClue;
    </script>
</body>
</html>
