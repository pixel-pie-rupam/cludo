<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECCOM 2025 | Treasure Hunt</title>
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/en/thumb/3/36/Brainware_University.svg/250px-Brainware_University.svg.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%); min-height: 100vh; }
        .glass-effect { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(148, 163, 184, 0.2); }
        .card-hover { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .gradient-border { background: linear-gradient(135deg, #06b6d4, #3b82f6, #8b5cf6); border-radius: 12px; padding: 2px; }
        .gradient-border-inner { background: #1e293b; border-radius: 10px; height: 100%; }
        .pulse-glow { animation: pulse-glow 2s infinite; }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(6, 182, 212, 0.3); }
            50% { box-shadow: 0 0 30px rgba(6, 182, 212, 0.6); }
        }
        .transition-all { transition: all 0.3s ease-in-out; }
        .spinner { border: 3px solid rgba(255, 255, 255, 0.3); border-left-color: #06b6d4; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .floating-particles { position: absolute; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }
        .particle { position: absolute; background: linear-gradient(45deg, #06b6d4, #3b82f6); border-radius: 50%; animation: float 6s infinite linear; opacity: 0.1; }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100px) rotate(360deg); }
        }
        .solved-overlay { background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(22, 163, 74, 0.3)); border: 2px solid rgba(34, 197, 94, 0.4); }
        .header-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border-bottom: 2px solid rgba(6, 182, 212, 0.3); }
        .footer-gradient { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-top: 1px solid rgba(148, 163, 184, 0.2); }
        .event-feed-scroll { scrollbar-width: thin; scrollbar-color: rgba(6, 182, 212, 0.5) rgba(51, 65, 85, 0.3); }
        .event-feed-scroll::-webkit-scrollbar { width: 6px; }
        .event-feed-scroll::-webkit-scrollbar-track { background: rgba(51, 65, 85, 0.3); border-radius: 3px; }
        .event-feed-scroll::-webkit-scrollbar-thumb { background: rgba(6, 182, 212, 0.5); border-radius: 3px; }
        .modal-backdrop { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); }
        .login-container { background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(51, 65, 85, 0.8)); backdrop-filter: blur(20px); border: 1px solid rgba(148, 163, 184, 0.2); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .input-focus { transition: all 0.3s ease; }
        .input-focus:focus { box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.3); border-color: #06b6d4; }
        
        /* Enhanced Broadcast Toast Styles */
        .broadcast-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            max-width: 90%;
            width: 500px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.95), rgba(59, 130, 246, 0.95));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(6, 182, 212, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideDown 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-100%); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        
        .broadcast-toast.hiding {
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(0); opacity: 1; }
            to { transform: translateX(-50%) translateY(-100%); opacity: 0; }
        }
        
        /* Mobile Responsive Adjustments */
        @media (max-width: 768px) {
            .card-hover:hover { transform: none; }
            .floating-particles { display: none; }
            .gradient-border { padding: 1px; }
            .event-feed-scroll { height: 250px; }
        }
        
        @media (max-width: 640px) {
            .broadcast-toast {
                top: 10px;
                left: 10px;
                right: 10px;
                transform: none;
                width: auto;
                max-width: none;
            }
            
            @keyframes slideDown {
                from { transform: translateY(-100%); opacity: 0; }
                to { transform: translateY(0); opacity: 1; }
            }
            
            .broadcast-toast.hiding {
                animation: slideUpMobile 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            }
            
            @keyframes slideUpMobile {
                from { transform: translateY(0); opacity: 1; }
                to { transform: translateY(-100%); opacity: 0; }
            }
        }
    </style>
</head>

    <!-- Firebase SDK (Replace with your config) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
        // --- CONFIGURATION --- (Replace with your Firebase config)
        const firebaseConfig = {
            // Your Firebase configuration here
             apiKey: "AIzaSyBokbGtzP7ZSp1mFS5K8hDUGRUB0E37UPs",
  authDomain: "treasurehuntcompetition2025.firebaseapp.com",
  projectId: "treasurehuntcompetition2025",
  storageBucket: "treasurehuntcompetition2025.firebasestorage.app",
  messagingSenderId: "983621809061",
  appId: "1:983621809061:web:ed668aceef58addbb1ee4c"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- DOM ELEMENT REFERENCES ---
        const loader = document.getElementById('loader');
        const loginScreen = document.getElementById('login-screen'), dashboardScreen = document.getElementById('dashboard-screen');
        const loginEmailInput = document.getElementById('login-email'), loginPasswordInput = document.getElementById('login-password');
        const loginButton = document.getElementById('login-button'), loginError = document.getElementById('login-error');
        const teamNameEl = document.getElementById('team-name'), teamScoreEl = document.getElementById('team-score'), logoutButton = document.getElementById('logout-button');
        const clueTierEl = document.getElementById('clue-tier'), cluesGrid = document.getElementById('clues-grid'), noCluesMessage = document.getElementById('no-clues-message');
        const eventFeed = document.getElementById('event-feed');
        const clueModal = document.getElementById('clue-modal'), closeModalButton = document.getElementById('close-modal-button');
        const modalClueTitle = document.getElementById('modal-clue-title'), modalClueText = document.getElementById('modal-clue-text');
        const hintSection = document.getElementById('hint-section'), hintButton = document.getElementById('hint-button'), hintText = document.getElementById('hint-text');
        const modalFlagInput = document.getElementById('modal-flag-input'), modalSubmitButton = document.getElementById('modal-submit-button'), modalFeedback = document.getElementById('modal-feedback');
        const broadcastToast = document.getElementById('broadcast-toast'), broadcastMessage = document.getElementById('broadcast-message');
        const closeBroadcast = document.getElementById('close-broadcast');

        // --- APP STATE & LISTENERS ---
        const appState = { currentTeam: null, currentTier: null, unsubscribe: {}, lastBroadcastMessage: null };
        const showLoader = (visible) => { loader.style.display = visible ? 'flex' : 'none'; };
        
        function clearAllListeners() {
            Object.values(appState.unsubscribe).forEach(unsub => unsub());
            appState.unsubscribe = {};
        }

        // --- BROADCAST MANAGEMENT ---
        function showBroadcast(message) {
            if (message === appState.lastBroadcastMessage) return; // Avoid showing same message repeatedly
            appState.lastBroadcastMessage = message;
            
            broadcastMessage.textContent = message;
            broadcastToast.classList.remove('hidden', 'hiding');
        }

        function hideBroadcast() {
            broadcastToast.classList.add('hiding');
            setTimeout(() => {
                broadcastToast.classList.add('hidden');
                broadcastToast.classList.remove('hiding');
            }, 300);
        }

        // Close broadcast when clicking the X button
        closeBroadcast.addEventListener('click', hideBroadcast);

        // --- AUTHENTICATION ---
        loginButton.addEventListener('click', async () => {
            loginButton.disabled = true;
            loginButton.innerHTML = `<div class="spinner"></div>`;
            try {
                await auth.signInWithEmailAndPassword(loginEmailInput.value, loginPasswordInput.value);
            } catch (error) {
                loginError.textContent = 'Invalid credentials.';
                loginButton.disabled = false;
                loginButton.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Login';
            }
        });
        
        logoutButton.addEventListener('click', () => auth.signOut());

        auth.onAuthStateChanged(user => {
            if (user) {
                loginScreen.classList.add('hidden');
                dashboardScreen.classList.remove('hidden');
                initializeListeners(user.uid);
            } else {
                loginScreen.classList.remove('hidden');
                dashboardScreen.classList.add('hidden');
                appState.currentTeam = null;
                appState.currentTier = null;
                appState.lastBroadcastMessage = null;
                clearAllListeners();
                hideBroadcast();
            }
        });
       
        // --- DATA INITIALIZATION ---
        async function initializeListeners(uid) {
            clearAllListeners();
            listenToEventLog();
            await listenToTeamData(uid);
            await listenToGameState();
            await listenToClues();
        }

        // --- REAL-TIME DATA LISTENERS ---
        function listenToTeamData(authUid) {
            return new Promise((resolve) => {
                const teamQuery = db.collection('teams').where('authUid', '==', authUid);
                appState.unsubscribe.team = teamQuery.onSnapshot(snapshot => {
                    if (!snapshot.empty) {
                        snapshot.forEach(doc => {
                            appState.currentTeam = { id: doc.id, ...doc.data() };
                            teamNameEl.textContent = appState.currentTeam.teamName;
                            teamScoreEl.textContent = appState.currentTeam.score;
                            resolve();
                        });
                    }
                });
            });
        }

        function listenToGameState() {
            return new Promise((resolve) => {
                appState.unsubscribe.gameState = db.collection('game_state').doc('main').onSnapshot(doc => {
                    const state = doc.data();
                    if (state) {
                        if (state.broadcastMessage && state.broadcastMessage.trim()) {
                            showBroadcast(state.broadcastMessage);
                        }
                        appState.currentTier = state.currentClueTier || 1;
                        clueTierEl.textContent = appState.currentTier;
                        resolve();
                    }
                });
            });
        }

        function listenToEventLog() {
            appState.unsubscribe.eventLog = db.collection('event_log').orderBy('timestamp', 'desc').limit(10).onSnapshot(snapshot => {
                eventFeed.innerHTML = '';
                snapshot.forEach(doc => {
                    const event = doc.data();
                    const div = document.createElement('div');
                    div.className = 'glass-effect p-3 rounded-lg transition-all hover:bg-slate-700/50';
                    div.innerHTML = `<div class="flex items-start space-x-3"><i class="fas fa-clock text-cyan-400 mt-1 text-sm"></i><p class="text-xs sm:text-sm text-slate-300 flex-1">${event.message}</p></div>`;
                    eventFeed.appendChild(div);
                });
            });
        }

        function listenToClues() {
            if (appState.unsubscribe.clues) appState.unsubscribe.clues();
            const cluesQuery = db.collection('clues').where('unlockTier', '==', appState.currentTier);
            appState.unsubscribe.clues = cluesQuery.onSnapshot(snapshot => {
                cluesGrid.innerHTML = '';
                noCluesMessage.style.display = snapshot.empty ? 'block' : 'none';
                snapshot.forEach(doc => {
                    const clue = { id: doc.id, ...doc.data() };
                    const isSolved = appState.currentTeam && (clue.solvers || {})[appState.currentTeam.id];
                    const card = document.createElement('div');
                    if (isSolved) {
                        card.className = 'glass-effect solved-overlay p-4 sm:p-6 rounded-xl shadow-lg relative overflow-hidden';
                        card.innerHTML = `<div class="relative z-10"><h4 class="text-lg sm:text-xl font-bold text-white mb-2">${clue.clueTitle}</h4><div class="flex items-center text-green-400"><i class="fas fa-check-circle mr-2"></i><span class="font-semibold text-sm sm:text-base">Solved!</span></div></div><div class="absolute top-2 right-2"><i class="fas fa-trophy text-yellow-400 text-xl sm:text-2xl opacity-20"></i></div>`;
                    } else {
                        card.className = 'glass-effect p-4 sm:p-6 rounded-xl shadow-lg cursor-pointer card-hover relative overflow-hidden group';
                        card.innerHTML = `<div class="relative z-10"><h4 class="text-lg sm:text-xl font-bold text-white mb-2 group-hover:text-cyan-300 transition-colors">${clue.clueTitle}</h4><div class="flex items-center text-slate-400 group-hover:text-cyan-400 transition-colors"><i class="fas fa-puzzle-piece mr-2"></i><span class="font-medium text-sm sm:text-base">Click to solve</span></div></div><div class="absolute top-2 right-2"><i class="fas fa-arrow-right text-cyan-400 text-lg sm:text-xl opacity-0 group-hover:opacity-100 transition-all transform translate-x-2 group-hover:translate-x-0"></i></div>`;
                        card.addEventListener('click', () => openClueModal(clue));
                    }
                    cluesGrid.appendChild(card);
                });
            });
        }
       
        // --- MODAL & SUBMISSION LOGIC ---
        function openClueModal(clue) {
            modalClueTitle.textContent = clue.clueTitle;
            modalClueText.textContent = clue.clueText;
            modalFlagInput.value = '';
            modalFeedback.textContent = '';
            hintText.classList.add('hidden');
            hintSection.style.display = clue.hint ? 'block' : 'none';
            if (clue.hint) {
                hintButton.disabled = false;
                hintButton.innerHTML = '<i class="fas fa-lightbulb mr-2"></i>Get Hint (-30 Points)';
                hintButton.onclick = () => handleHintRequest(clue);
            }
            clueModal.classList.remove('hidden');
            modalSubmitButton.onclick = () => handleFlagSubmission(clue);
        }
        
        closeModalButton.addEventListener('click', () => clueModal.classList.add('hidden'));

        async function handleHintRequest(clue) {
            if (appState.currentTeam.score < 30) { return alert("You don't have enough points for a hint!"); }
            if (!confirm("Are you sure you want to spend 30 points for a hint?")) return;
            hintButton.disabled = true;
            hintButton.innerHTML = '<div class="spinner mx-auto"></div>';
            showLoader(true);
            try {
                const teamRef = db.collection('teams').doc(appState.currentTeam.id);
                await teamRef.update({
                    score: firebase.firestore.FieldValue.increment(-30),
                    hintsUsed: firebase.firestore.FieldValue.increment(1)
                });
                hintText.innerHTML = `<div class="flex items-start space-x-3"><i class="fas fa-lightbulb text-yellow-400 mt-1"></i><div>${clue.hint}</div></div>`;
                hintText.classList.remove('hidden');
            } catch (error) {
                alert("Could not process hint request. Please try again.");
                hintButton.disabled = false;
                hintButton.innerHTML = '<i class="fas fa-lightbulb mr-2"></i>Get Hint (-30 Points)';
            } finally {
                showLoader(false);
            }
        }

        async function handleFlagSubmission(clue) {
            const submittedFlag = modalFlagInput.value.trim();
            if (submittedFlag !== clue.flag) {
                modalFeedback.innerHTML = '<i class="fas fa-times-circle mr-2"></i>Incorrect Flag.';
                modalFeedback.className = 'text-center mt-4 h-4 font-medium text-red-400 text-sm';
                return;
            }
            modalSubmitButton.disabled = true;
            modalSubmitButton.innerHTML = `<div class="spinner mr-2"></div>Submitting...`;
            const clueRef = db.collection('clues').doc(clue.id);
            const teamRef = db.collection('teams').doc(appState.currentTeam.id);
            try {
                const pointsAwarded = await db.runTransaction(async t => {
                    const clueDoc = await t.get(clueRef);
                    if (!clueDoc.exists) throw new Error("This clue seems to have disappeared!");
                    const clueData = clueDoc.data();
                    if ((clueData.solvers || {})[appState.currentTeam.id]) throw new Error("You have already solved this clue!");
                    const solverCount = Object.keys(clueData.solvers || {}).length;
                    let points = 150;
                    if (solverCount === 0) points = 250;
                    else if (solverCount <= 3) points = 200;
                    const newSolvers = { ...(clueData.solvers || {}) };
                    newSolvers[appState.currentTeam.id] = { teamName: appState.currentTeam.teamName, solvedAt: new Date() };
                    t.update(clueRef, { solvers: newSolvers });
                    t.update(teamRef, {
                        score: firebase.firestore.FieldValue.increment(points),
                        solvedClues: firebase.firestore.FieldValue.arrayUnion(clue.id)
                    });
                    return points;
                });
                await db.collection('event_log').add({
                    message: `Team "${appState.currentTeam.teamName}" solved '${clue.clueTitle}' for ${pointsAwarded} points!`,
                    timestamp: new Date()
                });
                modalFeedback.innerHTML = `<i class="fas fa-check-circle mr-2"></i>Success! You earned ${pointsAwarded} points!`;
                modalFeedback.className = 'text-center mt-4 h-4 font-medium text-green-400 text-sm';
                setTimeout(() => clueModal.classList.add('hidden'), 2000);
            } catch (error) {
                modalFeedback.innerHTML = `<i class="fas fa-exclamation-triangle mr-2"></i>${error.message}`;
                modalFeedback.className = 'text-center mt-4 h-4 font-medium text-red-400 text-sm';
            } finally {
                modalSubmitButton.disabled = false;
                modalSubmitButton.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>Submit Flag';
            }
        }

        // --- EVENT LISTENERS ---
        loginPasswordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loginButton.click(); });
        modalFlagInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') modalSubmitButton.click(); });

        // Close modal when clicking outside
        clueModal.addEventListener('click', (e) => {
            if (e.target === clueModal) {
                clueModal.classList.add('hidden');
            }
        });

        // Close broadcast when clicking outside (but not on the toast itself)
        document.addEventListener('click', (e) => {
            if (!broadcastToast.contains(e.target) && !broadcastToast.classList.contains('hidden')) {
                // Don't auto-close, let user manually close
            }
        });

        // Handle window resize for better mobile experience
        window.addEventListener('resize', () => {
            // Adjust modal positioning if needed
            if (!clueModal.classList.contains('hidden')) {
                // Modal is open, ensure it's still properly positioned
            }
        });

        // Prevent zoom on double tap for iOS
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // Handle orientation change
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                // Recalculate heights after orientation change
                window.scrollTo(0, 0);
            }, 500);
        });
    </script>
</body>
</html>
