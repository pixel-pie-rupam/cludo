<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | cludo.tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/en/thumb/3/36/Brainware_University.svg/250px-Brainware_University.svg.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1c3c;
            color: #e0e0e0;
            overflow: hidden;
            position: relative;
        }

        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .modal-backdrop {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }

        /* New animation styles */
        .blow-up-modal {
            animation: scale-up 0.5s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        .disappearing {
            animation: fade-out 0.5s ease-out forwards;
        }

        @keyframes scale-up {
            from {
                transform: scale(0.2);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fade-out {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Background SVG Shapes -->
    <div class="bg-shapes">
        <svg width="100%" height="100%" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                    <stop offset="0%" style="stop-color:rgba(45, 55, 125, 0.4)" />
                    <stop offset="100%" style="stop-color:rgba(45, 55, 125, 0)" />
                </radialGradient>
                <filter id="blur1">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="30" />
                </filter>
            </defs>
            <!-- Floating Spheres -->
            <circle cx="200" cy="150" r="100" fill="url(#grad1)" filter="url(#blur1)" />
            <circle cx="150" cy="250" r="80" fill="url(#grad1)" filter="url(#blur1)" />
            <circle cx="1200" cy="200" r="150" fill="url(#grad1)" filter="url(#blur1)" />
            <circle cx="1300" cy="350" r="120" fill="url(#grad1)" filter="url(#blur1)" />
            <!-- Bottom Wave -->
            <path d="M0,700 C200,850 600,600 800,750 C1000,900 1200,700 1440,800 L1440,900 L0,900 Z" fill="rgba(20, 22, 50, 0.5)"></path>
        </svg>
    </div>

    <!-- Header -->
    <header class="w-full p-6 md:p-8 z-10">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-4 h-4 border-2 border-white rounded-full"></div>
                <span class="font-bold text-lg">cludo.tech</span>
            </div>
            <a href="#" id="say-hello-link" class="text-sm font-medium hover:text-white transition-colors">Say Hello</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center text-center p-4 z-10">
        <p class="text-lg text-gray-400">Something great is on the way</p>
        <h1 class="text-6xl md:text-8xl font-thin tracking-wider my-4">COMING SOON</h1>
        
        <!-- Countdown Timer -->
        <div id="countdown" class="text-4xl md:text-5xl font-mono tracking-widest my-6">
            <span id="days">00</span>:<span id="hours">00</span>:<span id="minutes">00</span>:<span id="seconds">00</span>
        </div>
        <div class="flex space-x-8 md:space-x-16 text-xs text-gray-500 uppercase tracking-widest">
            <span>Days</span>
            <span>Hours</span>
            <span>Mins</span>
            <span>Secs</span>
        </div>
    </main>

    <!-- Say Hello Modal -->
    <div id="hello-modal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 hidden z-50">
        <h2 class="text-white font-thin" style="font-size: 8vw;">Hi</h2>
    </div>

    <script>
        // --- Countdown Timer Logic ---
        const countDownDate = new Date("September 6, 2025 00:00:00").getTime();
        const daysEl = document.getElementById("days");
        const hoursEl = document.getElementById("hours");
        const minutesEl = document.getElementById("minutes");
        const secondsEl = document.getElementById("seconds");

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "<p class='text-4xl'>We are live!</p>";
                document.querySelector('.flex.space-x-8').style.display = 'none';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            daysEl.textContent = String(days).padStart(2, '0');
            hoursEl.textContent = String(hours).padStart(2, '0');
            minutesEl.textContent = String(minutes).padStart(2, '0');
            secondsEl.textContent = String(seconds).padStart(2, '0');
        }, 1000);

        // --- "Say Hello" Modal Logic ---
        const sayHelloLink = document.getElementById('say-hello-link');
        const helloModal = document.getElementById('hello-modal');

        sayHelloLink.addEventListener('click', (e) => {
            e.preventDefault();
            
            // Show the modal and trigger the blow-up animation
            helloModal.classList.remove('hidden', 'disappearing');
            helloModal.classList.add('blow-up-modal');

            // Set a timer to make it disappear
            setTimeout(() => {
                helloModal.classList.remove('blow-up-modal');
                helloModal.classList.add('disappearing');

                // Set another timer to hide it after the fade-out animation finishes
                setTimeout(() => {
                    helloModal.classList.add('hidden');
                }, 500); // This duration must match the animation-duration in the CSS

            }, 2000); // The modal will be visible for 2 seconds
        });

    </script>
</body>
</html>
